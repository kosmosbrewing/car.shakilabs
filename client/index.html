    <script>
      (() => {
        try {
          const key = "car:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // no-op
        }
      })();
    </script>
    <style>
      :root {
        /* v3 §2.1 역할 토큰 — canvas/card/ink/ink-muted/line/focus는 hex에서 역산(반올림 왕복 검증 완료).
           2026-09-17 카테고리 색 정리(DESIGN_CLEANUP_PLAN §2.2): 청록(hue 175) → house와 같은
           파랑(hue 214)으로 그룹 통일. --ring은 건드리지 않는다 — color.focus(ink)는
           브랜드 hue와 무관하다(v3 §2.1, house에서 반대로 갔다가 조율자가 정정한 항목). */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 210 40% 96%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        --primary: 214 74% 33%;
        --primary-foreground: 0 0% 100%;
        --secondary: 214 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 214 72% 95%;
        --accent-foreground: 214 74% 30%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* v3 §4.1 카테고리 액센트 API — @shakilabs/ui 0.3.15가 읽는 계약: --accent-hsl / --accent-muted-hsl.
           --primary와 같은 값으로 주입 — SecondaryNav underline·ResultAmount 전용 */
        --accent-hsl: 214 74% 33%;
        --accent-muted-hsl: 214 74% 33%;
        /* --destructive는 --status-danger(main.css)와 같은 빨강이어야 한다(@shakilabs/ui
           tokens.css의 --sh-color-danger가 --destructive를 직접 구독). v3 고정 hex
           #C62828의 HSL — 카드 위 5.62:1, 캔버스 위 5.24:1로 이전 유도값보다도 여유 있다. */
        --destructive: 0 66.39% 46.67%;
        --destructive-foreground: 210 40% 98%;
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 214 16% 85%;
        --ring: 0 0% 3.92%; /* color.focus #0A0A0A (v3 §2.1 — 포커스는 브랜드색이 아니라 ink) */
        --radius: 0.4rem;
        /* WCAG AA: 이전 151 64% 37%은 흰 카드 위 3.55:1로 본문 기준(4.5:1) 미달이었다.
           2026-09-18: --profit 별칭을 폐기하고 v3 status-success(#1B7A4A)로 옮겼다. */
      }

      .dark {
        --background: 0 0% 7.06%; /* color.canvas dark #121212 */
        --foreground: 0 0% 96.08%; /* color.ink dark #F5F5F5 */
        --muted: 217 33% 17%;
        --muted-foreground: 60 3.33% 64.71%; /* color.ink-muted dark #A8A8A2 */
        --card: 0 0% 10.98%; /* color.card dark #1C1C1C */
        --card-foreground: 0 0% 96.08%;
        --primary: 213 94% 68%;
        --primary-foreground: 213 94% 10%;
        --secondary: 213 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 213 74% 22%;
        --accent-foreground: 213 94% 78%;
        --popover: 0 0% 10.98%;
        --popover-foreground: 0 0% 96.08%;
        --accent-hsl: 213 94% 68%;
        --accent-muted-hsl: 213 94% 68%;
        /* v3 고정 hex #F07171의 HSL — 카드 위 5.93:1, 기존 foreground(0 62% 12%)와
           짝지어도 6.1:1대로 그대로 통과해 foreground 값은 유지한다(실측, 게이트 참조). */
        --destructive: 0 80.89% 69.22%;
        --destructive-foreground: 0 62% 12%;
        --border: 0 0% 16.47%; /* color.line dark #2A2A2A */
        --input: 214 16% 30%;
        --ring: 0 0% 96.08%; /* color.focus dark #F5F5F5 */
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
        /* v3 §3.1 BL-061 — 앵커·H2가 고정 헤더/2차 내비에 가리지 않게 스크롤 오프셋 확보 */
        --header-h: 56px;
        --secondary-nav-h: 49px;
        scroll-padding-top: calc(var(--header-h) + var(--secondary-nav-h, 0px) + 8px);
      }

      /* 0.3.38 — <48rem에서는 탭 줄이 ☰로 접혀 고정 층이 헤더 하나뿐이다. 앵커 오프셋에서도 뺀다. */
      @media (max-width: 47.99rem) {
        html { --secondary-nav-h: 0px; }
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;

        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
